[project]
name = "skyarena"
version = "0.1.0"
description = "SkyArena: an 8-bit sky of real stars, flies, fish, and earthquakes."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.ruff]
line-length = 80
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"
